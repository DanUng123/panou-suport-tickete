<!DOCTYPE html>
<html lang="ro" class="mod-integrat" data-slug="{{slug}}">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Formular cereri</title>
<!--
  Documentul formularului integrat în magazinul clientului.

  Trei lucruri îl deosebesc de index.html, toate din același motiv — pagina
  asta se deschide de pe telefonul unui client, nu de la biroul unui operator:

  1. Fundalul. Aplicația are temă închisă, iar pagina ei apare întunecată din
     prima clipă, înainte să apuce JavaScript-ul să afle că e vorba de un
     formular integrat. În cadru asta se vedea ca un dreptunghi negru. Aici
     clasa e pusă direct pe <html>, iar fundalul e transparent de la primul
     pixel desenat.

  2. Greutatea. Nu încărcăm app.js (panoul operatorului, un sfert de
     megaoctet) și nici biblioteca de Excel. Doar comun.js și cerere.js, adică
     formularul și atât.

  3. Fonturile. Nu cerem fonturi de la Google: sunt două conexiuni în plus
     către un terț, care întârzie primul desen, iar formularul integrat își ia
     oricum fontul din pagina magazinului.

  `data-slug` și blocul de date de mai jos sunt scrise de server la fiecare
  cerere: așa formularul se desenează din prima, fără să mai întrebe cine e
  magazinul.
-->
<style>
  /* înainte chiar și de styles.css, ca să nu existe niciun cadru colorat */
  html, body { background: transparent; margin: 0; min-height: 0; }
  /* fontul paginii magazinului, cu o rezervă de sistem — niciun fișier de
     descărcat, deci textul apare din primul cadru */
  body { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
</style>
<link rel="stylesheet" href="/styles.css?v={{v}}" />
</head>
<body>
<div id="app"></div>
<script type="application/json" id="date-magazin">{{date}}</script>
<script src="/comun.js?v={{v}}"></script>
<script src="/cerere.js?v={{v}}"></script>
</body>
</html>
