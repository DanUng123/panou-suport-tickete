<!DOCTYPE html>
<html lang="ro" class="mod-integrat">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Formular cereri</title>
<!--
  Document separat pentru formularul integrat în magazinul clientului.

  Nu folosim index.html din două motive:

  1. Fundalul. Aplicația are temă închisă, iar pagina ei apare întunecată din
     prima clipă, înainte să apuce JavaScript-ul să afle că e vorba de un
     formular integrat. În cadru asta se vedea ca un dreptunghi negru, care
     dispărea abia după ce se încărca tot. Aici clasa e pusă direct pe <html>,
     iar fundalul e transparent de la primul pixel desenat.

  2. Greutatea. index.html încarcă și biblioteca de Excel, de care formularul
     nu are nevoie — aproape un megaoctet, pe pagina unui client care vrea doar
     să trimită un retur.
-->
<style>
  /* înainte chiar și de styles.css, ca să nu existe niciun cadru colorat */
  html, body { background: transparent; margin: 0; min-height: 0; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
<div id="app"></div>
<script src="/app.js"></script>
</body>
</html>
